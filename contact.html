<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Kurthipudi Ruthusha">

    <title>Contact | Ruthusha</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <nav aria-label="Main navigation">

        <a href="index.html">Home</a>

        <a href="about.html">About</a>

        <a href="projects.html">Projects</a>

        <a href="contact.html"
           aria-current="page">
           Contact
        </a>

    </nav>

</header>

<main>

<section aria-labelledby="contact-title">

    <h1 id="contact-title">Contact Me</h1>

    <form>

        <label for="name">Your Name</label>

        <input
            type="text"
            id="name"
            name="name"
            required
            autocomplete="name">

        <label for="email">Your Email</label>

        <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email">

        <label for="message">Your Message</label>

        <textarea
            id="message"
            name="message"
            rows="6"
            required>
        </textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>

</main>

<footer>
    <p>&copy; 2026 Kurthipudi Ruthusha</p>
</footer>

</body>
</html>
